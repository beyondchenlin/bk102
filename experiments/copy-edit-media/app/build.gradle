plugins { id 'com.android.application' }
android {
    namespace 'dsh.copyedit.spike'
    compileSdk 37
    defaultConfig {
        applicationId 'dsh.copyedit.spike'
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName '0.1.0-spike.1'
        testInstrumentationRunner 'dsh.copyedit.spike.EvidenceRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    // 性能验收沿用交付APK的非调试运行时；仍用独立测试身份/证书，证据由测试runner导出。
    buildTypes { debug { debuggable false } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.annotation:annotation-jvm:1.9.1'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation project(':copy-edit-media')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
